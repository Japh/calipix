[package]
name = "imager-app"
description = "The imager application: desktop interface and command line"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "imager"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
eframe = { workspace = true, optional = true }
imager-command.workspace = true
imager-commands.workspace = true
imager-core.workspace = true
imager-io.workspace = true
imager-render.workspace = true
serde_json.workspace = true

[features]
default = ["gui"]
# The desktop interface. Without it the binary is headless only.
gui = ["dep:eframe"]

[dev-dependencies]
imager-io.workspace = true

[lints]
workspace = true
