[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"
repository = "https://github.com/Japh/imager2"
rust-version = "1.99"

[workspace.dependencies]
calipix-core = { path = "crates/calipix-core" }
calipix-command = { path = "crates/calipix-command" }
calipix-command-derive = { path = "crates/calipix-command-derive" }
calipix-io = { path = "crates/calipix-io" }
calipix-render = { path = "crates/calipix-render" }
calipix-commands = { path = "crates/calipix-commands" }
calipix-ops = { path = "crates/calipix-ops" }
calipix-view = { path = "crates/calipix-view" }

anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui_kittest = "0.36.2"
egui_tiles = "0.17.1"
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
num-complex = "0.4"
proc-macro2 = "1"
proptest = "1"
quote = "1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }
thiserror = "2"
tiff = { version = "0.11", default-features = false, features = ["deflate", "lzw"] }
weezl = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev.package."*"]
opt-level = 2
# Dependencies are not stepped through; leaving out their debug info keeps
# the target directory several gigabytes smaller.
debug = false
